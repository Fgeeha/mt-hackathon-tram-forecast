[project]
name = "tram-forecast"
version = "0.1.0"
description = "Прогноз пассажиропотока трамвайных маршрутов Москвы"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "polars>=1.8",
    "pyarrow>=17",
    "numpy>=1.26",
    "lightgbm>=4.5",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "orjson>=3.10",
    "duckdb>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tram_forecast"]

[tool.ruff]
line-length = 100
